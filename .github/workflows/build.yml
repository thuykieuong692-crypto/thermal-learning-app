name: Build Signed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias thermal \
            -storepass android -keypass android \
            -dname "CN=Thermal Learning, OU=App, O=Personal, L=Beijing, ST=Beijing, C=CN"
          mkdir -p "$GITHUB_WORKSPACE/keystore"
          cp release.keystore "$GITHUB_WORKSPACE/keystore/release.keystore"

      - name: Build release APK
        uses: gradle/gradle-build-action@v3
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: thermal
          KEY_PASSWORD: android
        with:
          gradle-version: '8.9'
          arguments: assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thermal-learning-apk
          path: app/build/outputs/apk/release/*.apk
