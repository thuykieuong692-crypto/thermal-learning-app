<title>航空发动机热管理 · 学习系统</title>
<style>
:root{
  --bg:#0b1220; --bg2:#121b2e; --card:#172238; --card2:#1d2b46;
  --line:#26344f; --txt:#e7edf6; --sub:#9fb0c9; --mut:#6b7c98;
  --blue:#3b82f6; --blue2:#2563eb; --orange:#f97316; --green:#22c55e;
  --amber:#f59e0b; --red:#ef4444; --purple:#a855f7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);
  padding-bottom:74px;padding-top:env(safe-area-inset-top)}
header.top{
  position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0e1830,#13243f);
  padding:14px 16px 12px;border-bottom:1px solid var(--line);
}
header.top .h1{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
header.top .h1 .fl{font-size:20px}
header.top .sub{font-size:12px;color:var(--sub);margin-top:3px}
main{flex:1;padding:14px 14px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer;transition:.15s}
.card.tap:active{transform:scale(.985);background:var(--card2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--mut)} .sub2{color:var(--sub)}
.tiny{font-size:11px} .sm{font-size:13px} .md{font-size:15px} .lg{font-size:18px;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:#0e1626}
.tag.video{color:#fca5a5;border-color:#7f1d1d;background:#2a1216}
.tag.book{color:#93c5fd;border-color:#1e3a8a;background:#0f1d33}
.tag.paper{color:#fcd34d;border-color:#854d0e;background:#271d07}
.tag.tool{color:#86efac;border-color:#14532d;background:#0c2114}
.tag.standard{color:#c4b5fd;border-color:#4c1d95;background:#1a1230}
.tag.software{color:#67e8f9;border-color:#155e75;background:#082330}
.tag.exercise{color:#fdba74;border-color:#9a3412;background:#241207}
.ring{position:relative;width:120px;height:120px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:#0e1626;cursor:pointer}
.chip.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.material{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.material:last-child{border-bottom:0}
.material .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:#0e1626;border:1px solid var(--line);flex:0 0 auto}
.btn{display:inline-block;font-size:12px;padding:5px 11px;border-radius:9px;background:var(--blue2);color:#fff;text-decoration:none;border:0;cursor:pointer}
.btn.out{background:#0e1626;border:1px solid var(--line);color:var(--sub)}
.kanban{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kcol{background:#0e1626;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.kcol h4{margin:0 0 8px;font-size:12px;color:var(--sub);text-align:center}
.kitem{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:7px;font-size:12px;cursor:pointer}
.kitem .d{font-size:10px;color:var(--mut);margin-top:3px}
.seg{display:flex;background:#0e1626;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--sub);padding:9px 0;font-size:13px;cursor:pointer}
.seg button.on{background:var(--blue2);color:#fff;font-weight:600}
.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.65;color:var(--txt)}
.detail .k{color:var(--sub);font-size:11px;margin:8px 0 2px}
.links a{display:inline-block;margin:3px 6px 3px 0}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar input{background:#0e1626;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:6px 10px;font-size:13px}
footer.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#0c1424;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
footer.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
footer.tabs button .i{font-size:18px;line-height:1}
footer.tabs button.on{color:#fff}
footer.tabs button.on .i{filter:drop-shadow(0 0 6px var(--blue))}
.sec-title{font-size:14px;font-weight:700;margin:4px 2px 10px;display:flex;align-items:center;gap:7px}
.sec-title .bar{width:4px;height:15px;background:var(--orange);border-radius:2px}
.hidden{display:none}
a.ext{color:var(--blue);text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.barmini{height:6px;border-radius:4px;background:#0e1626;overflow:hidden;margin-top:6px}
.barmini > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}
/* 知识点折叠块 */
.kp{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#0e1626;overflow:hidden}
.kp .kpt{font-size:12px;font-weight:600;padding:8px 10px;cursor:pointer;color:var(--txt)}
.kp .kpb{font-size:12px;line-height:1.65;color:var(--sub);padding:0 10px;max-height:0;overflow:hidden;transition:max-height .25s ease}
.kp.open .kpb{max-height:420px;padding:0 10px 9px;border-top:1px dashed var(--line)}
.kpsec{font-size:12px;line-height:1.75;color:var(--sub);margin:8px 0}
.kpsec b{color:var(--txt);display:inline-block;min-width:34px;margin-right:5px;font-weight:600}
.kprv{font-size:11px;color:var(--blue);background:#0b1a33;border:1px solid #1e3a8a;border-radius:8px;padding:7px 9px;margin:9px 0 2px;cursor:pointer}
/* 每日学习记录 */
.logbox{margin-top:10px}
.logbox textarea{width:100%;background:#0e1626;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px;font-size:13px;min-height:72px;box-sizing:border-box;font-family:inherit;resize:vertical}
.logbox input[type=number]{width:84px;background:#0e1626;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:6px 8px;font-size:13px}
.logrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.saved{color:var(--green);font-size:11px;margin-left:6px}
</style>
</head>

const KNOWLEDGE = {"1": [{"t": "开口系统能量方程", "d": "描述控制体内质量与能量守恒的基本关系。对稳态开口系统：单位时间进入控制体的能量加上内热源产热，等于离开的能量加上对外做功。工程常用简化式 Q̇ − Ẇ = ṁ(h_out − h_in)。", "a": "关键在于控制体的选取——先画边界，再标出所有进出质量流、热量、功。四项能量为：随质量带入带出的焓、热量、轴功、动能位能变化。稳态下控制体内能量不随时间变化，方程不含时间项。对发动机部件，动能与位能变化远小于焓变，可忽略，于是简化为 Q̇−Ẇ=ṁΔh。这个简化式是滑油回路、燃油回路热平衡的出发点，必须练到能随手列写。", "e": "滑油回路：轴承与齿轮总发热 8 kW，滑油流量 30 L/min（ρ≈870 kg/m³ → ṁ≈0.435 kg/s），c_p≈2000 J/(kg·K)。由 Q=ṁc_pΔT 得 ΔT = 8000/(0.435×2000) ≈ 9.2 K。即滑油流经轴承腔后温升约 9.2℃。若实测温升明显大于此值，说明流量不足或发热被低估。"}, {"t": "傅里叶定律与导热热阻", "d": "傅里叶定律 q = −k∇T：热流密度正比于温度梯度，比例系数为导热系数 k，负号表示热量从高温流向低温。一维稳态导热可折算成热阻：平壁 R=δ/(kA)；圆筒壁径向 R=ln(r₂/r₁)/(2πkL)。", "a": "热阻类比电阻：温差是电压，热流是电流，R 是电阻。k 由材料决定——金属 k 大（铜约 400 W/mK）、气体 k 小（空气约 0.03）、隔热材料更小（0.02–0.1）。圆筒壁热阻随半径对数增长，所以增厚保温层在半径较大时收益递减，存在临界绝缘半径问题。串联热阻直接相加，这是分析多层壁的基础。", "e": "涡轮叶片壁厚 δ=2 mm，高温合金 k≈25 W/mK，面积 A=0.01 m²。导热热阻 R = 0.002/(25×0.01) = 0.008 K/W。若通过热流 5000 W，则壁两侧温差 ΔT = 5000×0.008 = 40 K。仅 2 mm 壁厚就产生 40 K 温差——说明壁厚与材料导热率对金属温度影响很大，减薄与选高 k 材料都能降温。"}, {"t": "牛顿冷却定律与对流换热", "d": "牛顿冷却定律 q = h(T_w − T_f)：壁面与流体间的对流热流密度正比于壁温与流体主流温度之差，比例系数 h 为对流换热系数。努塞尔数 Nu = hL/k 表征对流换热相对于纯导热的强化倍数。", "a": "h 不是物性，而是受流动状态、几何、物性影响的综合参数。Nu=1 表示纯导热；强制对流通常 Nu 在几十到几百。管内湍流用 Dittus-Boelter：Nu=0.023Re^0.8Pr^n（流体被加热 n=0.4，被冷却 n=0.3）。自然对流、沸腾、冷凝各有不同关联式。典型 h 量级：空气强制对流 10–100，水强制对流 1000–10000，沸腾 5000–50000 W/m²K。", "e": "涡轮冷却通道内 h=800 W/m²K，燃气侧壁面 1200 K，冷却空气 700 K，则热流 q = 800×(1200−700) = 4×10⁵ W/m² = 0.4 MW/m²。这就是涡轮叶片典型热流量级——每平方米几十万瓦，所以必须用内部冷却加气膜的组合才能压住金属温度。"}, {"t": "热阻网络法", "d": "把导热、对流、辐射统一折算成热阻，按串并联规则组成网络求解热流与温度的方法。串联总热阻为各段之和，并联总热阻的倒数为各支路倒数之和。", "a": "类比电路：热流 q 在串联路径上处处相等，温差按各段热阻分配。总传热系数 U 满足 1/(UA) = ΣR_i。这个方法把复杂复合换热变成一张电路图，便于快速判断瓶颈——热阻最大的那段就是强化换热的重点。涡轮叶片典型网络为：燃气侧对流（含气膜）→ 外壁导热 → 涂层 → 内壁对流 → 冷气温升。", "e": "平板换热：热侧 h₁=1000、壁厚 δ=0.005 m 且 k=20、冷侧 h₂=2000（单位 W/m²K）。单位面积热阻 R″ = 1/1000 + 0.005/20 + 1/2000 = 0.001 + 0.00025 + 0.0005 = 0.00175 m²K/W。U = 1/0.00175 ≈ 571 W/m²K。热阻占比：热侧 57%、壁 14%、冷侧 29%——要提升 U 应优先强化热侧。"}, {"t": "换热器计算：LMTD 与 ε-NTU", "d": "两种换热器计算方法。LMTD（对数平均温差）：Q = U·A·ΔT_lm，其中 ΔT_lm=(ΔT₁−ΔT₂)/ln(ΔT₁/ΔT₂)，用于已知四个进出口温度求换热量。ε-NTU：ε = 实际换热量/最大可能换热量，用于已知流量与进口温度求出口温度。", "a": "LMTD 需已知或假定出口温度，逆流时 ΔT_lm 最大、顺流最小，其他流型要乘修正系数 F（通常要求 F>0.8）。ε-NTU 引入传热单元数 NTU=UA/C_min 与热容比 C_r=C_min/C_max，逆流时 ε=(1−exp[−NTU(1−C_r)])/(1−C_r·exp[−NTU(1−C_r)])。判据：求换热量用 LMTD 直接；求出口温度用 ε-NTU 可免试算。", "e": "燃-滑油换热器：滑油 C_h=0.85 kW/K 进口 120℃；燃油 C_c=0.5 kW/K 进口 40℃；UA=2 kW/K。C_min=0.5，C_r=0.5/0.85=0.588，NTU=2/0.5=4。逆流 ε=(1−e^[−4×0.412])/(1−0.588×e^[−4×0.412]) = (1−0.1924)/(1−0.1131) ≈ 0.911。Q = 0.911×0.5×80 = 36.4 kW。燃油出口 = 40 + 36.4/0.5 = 112.8℃（已接近结焦温度，必须校核壁温）。"}], "2": [{"t": "发动机热源与部件温度等级", "d": "发动机内产生热量或处于高温的部件及其典型工作温度区间。热源包括燃烧室（燃气）、涡轮（被高温燃气冲刷）、轴承腔与齿轮箱（摩擦生热）、附件（发电机、液压泵）。", "a": "温度等级决定材料与冷却方案的选择。压气机出口约 600–900 K；燃烧室出口/涡轮进口 TIT 约 1500–1900 K；高压涡轮叶片金属温度 1300–1600 K；低压涡轮 1100–1400 K；滑油 350–450 K。务必区分燃气温度与金属温度——金属温度才是决定寿命的量，两者之差正是冷却系统创造的价值。", "e": "某型涡扇 TIT=1700 K，高压涡轮导向器金属允许 1250 K。则冷却系统需要创造 450 K 的温降。若冷气来自压气机出口 800 K，由 Φ=(T_g−T_m)/(T_g−T_c)=(1700−1250)/(1700−800)=0.5，即需要综合冷却效率 0.5——这是气膜加内部对流复合冷却的典型水平。"}, {"t": "热沉系统", "d": "能够吸收并带走热量的介质或系统。航空发动机主要热沉：外涵/冲压空气、燃油、滑油（滑油最终也把热量交给空气或燃油）。", "a": "热沉的温度决定了冷却能达到的最低金属温度——选低温热沉是关键，但低温热沉往往量少或需要付出代价（如引气损失推力）。燃油是机上最大的热沉之一，但受结焦温度限制（约 150–180℃）。热沉选择本质是温度—量—代价的三方权衡。", "e": "某工况可用热沉：燃油 20 kg/s、允许温升 60 K、c_p≈2000 → 可吸热 20×2000×60 = 2.4 MW。外涵空气 5 kg/s、允许温升 100 K、c_p≈1005 → 0.5 MW。若总热负荷 2.6 MW，则燃油是主力，不足部分由空气补。起飞时燃油流量相对热负荷偏小 → 燃油热沉能力骤降，这就是最恶劣工况。"}, {"t": "热流路径与热阻分解", "d": "从热源（燃气）到热沉（冷气/燃油）之间热量传递经过的全部环节，按热阻网络拆解：燃气侧对流+辐射 → 外壁导热 → 涂层 → 内壁对流 → 冷气侧对流 → 冷气温升带走。", "a": "每一环都有热阻，总温降按热阻比例分配。降低金属温度的关键是找到并削减最大热阻项。常见瓶颈：燃气侧热阻（用气膜冷却有效）、涂层热阻（TBC 导热极低，是双刃剑——它隔离了外部热量，但也阻碍内部冷却把热带走）。", "e": "叶片壁面：燃气侧有效 h_g=1200（含气膜后）、TBC 厚 0.2 mm 且 k=1.5 → R=1.33e-4、金属壁 2 mm 且 k=25 → 8e-5、内部 h_i=800。单位面积总热阻 = 1/1200 + 1.33e-4 + 8e-5 + 1/800 = 2.3e-3 m²K/W。若 T_g=1700、T_c=800，则 q=(1700−800)/2.3e-3 ≈ 391 kW/m²。金属外侧温度 = 1700 − 391000×9.66e-4 ≈ 1322 K。"}, {"t": "TIT 与性能权衡", "d": "涡轮进口温度（Turbine Inlet Temperature）是决定发动机性能的核心参数。提高 TIT 能提升单位推力与热效率，但会同步抬高涡轮部件金属温度。", "a": "经验规律：TIT 每升高约 100 K，推力约提升 8–13%、耗油率约下降 2–4%。代价是需要更强冷却（更多引气导致推力损失、油耗回升）或更耐热材料（CMC、单晶高温合金）。因此存在最优 TIT：不是越高越好，而是性能增益与冷却代价加寿命损失的平衡点。", "e": "将 TIT 从 1600 K 提到 1700 K：推力 +10%，但为维持叶片金属温度不超过 1250 K，需把冷却效率从 Φ=(1600−1250)/(1600−800)=0.4375 提高到 (1700−1250)/(1700−800)=0.5。若引气量需增加 2% 总空气流量，推力损失约 1–1.4%——净收益约 +8.6%，仍然划算，但寿命可能下降。"}, {"t": "静子（导向器）为何更难冷却", "d": "涡轮导向器（静子叶片）不旋转，直接面对燃烧室出口最高温燃气，且无法利用旋转带来的强化换热与气膜覆盖优势。", "a": "三点原因：① 导向器位于燃烧室出口，承受最高燃气温度与最高热流；② 静子无法像转子那样通过旋转增强内部对流（旋转通道的科氏力与离心浮力可强化换热）；③ 静子冷气压力受限于压气机引气压力，气膜孔布置受气动限制。因此导向器通常比转子叶片需要更高的冷气比例，是冷却设计的重点与难点。", "e": "同一级中，导向器冷气量约占该级总冷气的 55–60%，转子占 40–45%，尽管转子也有复杂内冷结构。设计上常给导向器配置冲击加气膜的复合方案，前缘采用密集气膜孔（showerhead）覆盖。若导向器冷却不足，往往首先在前缘与尾缘出现烧蚀。"}], "3": [{"t": "引气来源与位置选择", "d": "从压气机不同级抽取空气用于冷却、封严、防冰等用途的方案选择。", "a": "核心原则是够用即可、尽量从低级引气。因为引气级越靠后，空气温度越高、压力越高，但抽取它付出的压缩功代价越大。高压涡轮需要高压力冷气（要克服叶片内部流阻并喷出形成气膜），通常从高压压气机末级或出口引；低压涡轮对压力要求较低，从中压或低压级引气可显著减少代价。", "e": "某发动机：高压涡轮冷气取自高压压气机出口（p=30 bar, T=800 K）；低压涡轮取自中压级（p=8 bar, T=600 K）。若把低压涡轮改从高压出口引气，虽然压力足够，但空气温度高 200 K，冷却能力大幅下降，且压缩功代价显著上升——典型的过度设计。"}, {"t": "预旋喷嘴", "d": "装在转子冷却空气入口处的导向叶片，使冷气在进入旋转通道前获得与转子同向的周向速度，从而降低冷气在旋转坐标系下的相对总温。", "a": "在旋转坐标系下，相对总温 T_rel = T + (W²−U²)/(2c_p)，其中 W 是相对速度、U 是圆周速度。若冷气无周向速度（C_θ=0），进入旋转通道后相对速度很大、相对总温高，冷却能力差。预旋让冷气获得周向速度（预旋比 = C_θ/(ωr) ），则相对速度的周向分量减小、相对总温下降，冷却效果提升。代价是喷嘴的流动损失。", "e": "冷气 T=700 K，转子 U=300 m/s。无预旋时相对速度的周向分量约 300 m/s，相对总温约 700 + 300²/(2×1005) = 744.8 K。预旋比 0.8 后周向相对速度降至约 60 m/s，相对总温约 702 K。相比无预旋降低约 43 K——这 43 K 直接转化为金属温度下降，价值很高。"}, {"t": "篦齿封严与刷式封严", "d": "两种控制旋转件与静止件之间间隙泄漏的封严结构。篦齿（labyrinth）靠多级节流齿逐级降压；刷式（brush）靠柔性刷丝束贴合转子表面。", "a": "篦齿结构简单可靠、耐脏，但泄漏量较大且磨损后间隙不可恢复；典型 6–8 齿，每齿节流降压约 15–20%。刷式泄漏量约为篦齿的 1/5–1/10，刷丝可随转子窜动补偿，磨损后仍能保持密封；缺点是成本高、刷丝可能断裂、对转子表面光洁度要求高。选型权衡是泄漏代价与成本可靠性之比。", "e": "某封严处压差 20 bar、间隙 0.3 mm。篦齿泄漏量约 0.8% 主流；改用刷式后降至 0.15%。若该处泄漏每 1% 造成 0.5% 推力损失，则改用刷式可挽回约 0.33% 推力——在长航程飞机上燃油收益可观，但需权衡刷式封严的更换成本与维护间隔。"}, {"t": "主动间隙控制 ACC", "d": "通过向涡轮机匣喷射压气机引气（冷却或加热机匣），控制机匣热膨胀，使叶尖间隙在关键工况下保持最小的技术。", "a": "叶尖间隙每增加 0.1 mm，涡轮效率约下降 0.2–0.5%。间隙受转子（离心加受热膨胀）与机匣（热膨胀）的相对变形控制。起飞等大状态时转子快速膨胀、机匣膨胀滞后，间隙先变小甚至碰磨；巡航稳态时需要最小间隙。ACC 用冷气吹机匣使其收缩（或用热气加热使其膨胀）来主动调节。", "e": "巡航时开启 ACC 冷气吹机匣，机匣收缩 0.25 mm，叶尖间隙从 0.6 mm 减到 0.35 mm。涡轮效率提升约 0.5%，对应巡航耗油率下降约 0.4%。代价是 ACC 引气约占 0.5–1% 主流，需确认净收益为正——这正是热管理中典型的得失权衡。"}, {"t": "二次空气分配与引气代价", "d": "发动机抽取的二次空气在冷却、封严、防冰、引射等用途间的分配比例，及其带来的性能代价。", "a": "典型分配：涡轮冷却 50–60%、封严与间隙控制 20–30%、防冰/增压/引射 10–20%。代价构成为：① 压缩这些空气所耗的功；② 引气掺混主流造成的总压损失；③ 未参与燃烧造成的推力损失。经验值：每 1% 的引气约带来 0.5–0.7% 的推力损失或 0.5–1% 的耗油率上升。", "e": "某发动机总引气 15%：冷却 8%、封严 4%、其他 3%。若通过改进冷却结构把冷却引气从 8% 降到 6.5%，则总引气降至 13.5%，推力损失从约 9% 降到 8%，即挽回约 1% 推力——这是热管理优化最直接的价值体现。"}], "4": [{"t": "综合冷却效率 Φ", "d": "衡量冷却效果的无量纲指标：Φ = (T_g − T_m)/(T_g − T_c)，其中 T_g 为燃气总温、T_c 为冷气进口温度、T_m 为金属温度。", "a": "Φ 的意义是金属温度被冷气压低了多少。Φ=0 表示金属温度等于燃气温度（完全没有冷却）；Φ=1 表示金属温度等于冷气温度（理想冷却）。实际涡轮叶片 Φ 约 0.4–0.7。Φ 越高，达到同样金属温度所需的冷气越少。注意 Φ 依赖 T_c——冷气温度越低 Φ 越高，这正是预旋与外涵引气的价值所在。", "e": "T_g=1700 K、T_c=800 K、允许 T_m=1250 K → 需要 Φ=(1700−1250)/(1700−800)=0.5。若改用外涵冷气 T_c=500 K，同样 Φ=0.5 下 T_m = 1700−0.5×(1700−500)=1100 K，金属温度降低 150 K——可显著延长寿命，或用来提高 TIT 换取性能。"}, {"t": "内部对流冷却", "d": "在叶片内部铸造或加工出通道，让冷气从内部流过带走热量的冷却方式，常配合扰流肋（rib）强化换热。", "a": "内部通道形式：光滑通道（换热弱）、带扰流肋的蛇形通道（换热强、流阻大）、带柱肋的尾缘通道（兼有强度支撑）。强化原理是肋片周期性破坏边界层并产生二次流。评价用强化比与阻力比——换热提升 2–3 倍通常伴随阻力增加 3–6 倍，需权衡泵功耗。", "e": "蛇形通道带 45° 斜肋：Re=30000 时 Nu/Nu₀≈2.5（换热提升 2.5 倍），f/f₀≈5（阻力增加 5 倍）。若原 h=500 W/m²K，则强化后 1250 W/m²K。内壁面积 0.02 m²、壁温 1150 K、冷气 700 K → 换热量 = 1250×0.02×450 = 11.25 kW。"}, {"t": "冲击冷却", "d": "让冷气通过小孔形成高速射流，直接冲击内壁面（尤其前缘等高热负荷区），利用极薄边界层获得很高局部换热系数的冷却方式。", "a": "冲击换热系数可达常规对流换热的 3–5 倍，但衰减很快——离开滞止点后换热系数迅速下降。因此冲击适用于局部热点而非大面积。关键参数：冲击距离 H/d、射流 Re、孔排布（阵列/单排）。常与气膜孔、扰流肋组合形成复合冷却。", "e": "叶片前缘内腔布置冲击孔阵列：d=0.5 mm、H/d=4、Re=10000。局部 h 可达 2000–3000 W/m²K（对比常规通道 500–800）。面积 0.005 m²、壁温 1200 K、冷气 700 K → 换热量 = 2500×0.005×500 = 6.25 kW，有效压制前缘高温。"}, {"t": "气膜冷却", "d": "从壁面气膜孔喷出的冷气在主流的压迫下贴附壁面，形成一层低温气膜把壁面与高温燃气隔开的冷却方式。气膜冷却效率 η_f=(T_g−T_aw)/(T_g−T_c)，T_aw 为绝热壁温。", "a": "关键参数：吹风比 M=(ρ_c V_c)/(ρ_g V_g)、密度比 DR、孔型（圆柱孔/扇形孔/簸箕孔）、入射角与复合角。M 过小气膜覆盖不足；M 过大气膜会脱离壁面（吹飞）反而恶化。扇形孔通过扩张出口降低出口动量，可在高 M 下保持贴附，效率显著优于圆柱孔。", "e": "圆柱孔 M=0.6、DR=2.0：展向平均 η_f 约 0.15–0.25。改用扇形孔（出口扩张 10°）在同样 M 下 η_f 可达 0.30–0.40。若 T_g=1700、T_c=800，圆柱孔下 T_aw=1700−0.2×900=1520 K；扇形孔下 T_aw=1700−0.35×900=1385 K，差 135 K——孔型改进价值显著。"}, {"t": "热障涂层 TBC 与 Bi 数判据", "d": "TBC 是喷涂在金属表面的低导热陶瓷层（典型 7YSZ，厚 100–400 μm，k≈1–2 W/mK），可降低金属温度 50–150 K。Bi=hL/k_s 是判断物体能否按等温体处理的无量纲数。", "a": "TBC 的作用是在热流不变时产生额外温降（ΔT=q·δ/k）。它是热障——既阻挡外部热量进入，也阻碍内部冷却把热带走，所以必须与内部冷却配合才有净收益。失效模式是热生长氧化物（TGO）增厚产生应力导致剥落。Bi<0.1 可按集中参数处理，涡轮叶片 Bi 通常接近或大于 0.1，必须做温度场分析。", "e": "TBC 厚 0.25 mm、k=1.5 W/mK，热流 q=0.4 MW/m² → 温降 ΔT = 0.4e6×0.00025/1.5 = 66.7 K，即金属温度比涂层表面低约 67 K。Bi 校核：h=1200、L=0.002 m、k_s=25 → Bi=0.096，接近 0.1 临界，说明壁厚方向已有明显温度梯度，使用等温假设需谨慎。"}], "5": [{"t": "滑油系统功能与组成", "d": "滑油系统为发动机轴承、齿轮提供润滑与冷却，典型组成：油箱、供油泵、油滤、散热器（ACOC/FCOC）、除气器、回油泵、喷嘴与管路、传感器。", "a": "五大功能：润滑（形成油膜避免金属直接接触）、冷却（带走轴承与齿轮摩擦热）、清洁（滤除磨损颗粒）、密封（辅助封严）、防锈。热管理重点关注冷却这一支。循环路径：油箱→增压泵→油滤→冷却器→轴承/齿轮→回油泵→除气→回油箱。", "e": "典型参数：供油压力 3–5 bar、供油温度 60–90℃、回油温度 100–140℃、油箱容量满足 30 s 以上循环量。若回油温度超过 160–180℃，说明散热不足或发热异常，需检查散热器结垢、流量不足或轴承损伤。"}, {"t": "轴承与齿轮发热", "d": "轴承与齿轮在运转中因摩擦产生的热量，是滑油系统需要带走的主要热负荷。", "a": "滚动轴承发热可用摩擦力矩法：Q = M·ω，M 由载荷与润滑状态决定（可用经验式估算）。齿轮发热来自啮合效率损失：Q_gear = P_input×(1−η)，单级 η 约 0.98–0.99。发热随转速、载荷、滑油粘度上升而增加。准确的发热计算是滑油系统热平衡的输入，估错会导致流量或散热器选型偏差。", "e": "某轴承 d_m=100 mm、n=12000 rpm、中等载荷：估算摩擦力矩 M≈0.35 N·m，ω=2π×12000/60=1257 rad/s → Q=0.35×1257≈440 W。若该轴承腔有 3 套轴承，加上一对齿轮（传递 500 kW、损失 1.5% → 7.5 kW），总发热约 8–9 kW。"}, {"t": "滑油热平衡方程", "d": "稳态下滑油系统带走的热量等于各热源发热量之和：Q_bearing + Q_gear = ṁ_oil·c_p·ΔT = Q_ACOC + Q_FCOC + Q_ambient。", "a": "这是滑油系统热设计的核心方程。左边是热负荷，中间是滑油吸热能力，右边是各散热途径。求解目的：① 已知发热求所需滑油流量；② 已知流量求温升；③ 已知温升要求求散热器负荷。需注意 c_p 随温度变化（滑油约 1900–2100 J/kgK），密度约 850–900 kg/m³，要区分体积流量与质量流量。", "e": "总发热 8 kW，要求滑油温升不超过 10 K，c_p=2000 → ṁ = 8000/(2000×10)=0.4 kg/s。换算体积流量：0.4/870 ≈ 4.6e-4 m³/s = 27.6 L/min。若 FCOC 承担 6 kW、ACOC 承担 1.6 kW、环境散热 0.4 kW，则总散热 8 kW，达到平衡。"}, {"t": "ACOC 与 FCOC", "d": "ACOC（Air-Cooled Oil Cooler，空-滑油散热器）用外涵或冲压空气冷却滑油；FCOC（Fuel-Cooled Oil Cooler，燃-滑油散热器）用燃油冷却滑油。", "a": "FCOC 换热系数高（燃油侧 h 大）且不消耗气动代价，是主流滑油散热方式；但会把热量转移给燃油，需校核燃油温升与结焦。ACOC 用空气冷却，最终把热排到大气，但引入气动阻力（冲压空气进气阻力）。两者常串联：滑油先经 FCOC（主散热），再经 ACOC（补充/调节）。", "e": "滑油 0.4 kg/s、c_p=2000，从 130℃降到 90℃ → 需散热 Q=0.4×2000×40=32 kW。若 FCOC 承担 25 kW：燃油 0.5 kg/s、c_p=2000 → 燃油温升 = 25000/(0.5×2000)=25 K。燃油入口 40℃ → 出口 65℃，远低于结焦阈值，安全。"}, {"t": "除气与温度控制", "d": "除气是分离回油中混入空气的过程；温度控制是把供油/回油温度维持在允许区间的手段。", "a": "滑油在轴承腔高速搅动会混入大量空气形成泡沫，危害：降低油膜强度导致润滑失效、引起泵气蚀、加速氧化变质。回油经离心式除气器分离空气后回油箱。温度控制目标：供油 60–90℃（过低粘度大、流动损失大；过高易氧化），回油不超过 140–160℃（低于闪点，防止结焦与火灾风险）。", "e": "若测得供油温度 110℃（超出 90℃ 上限），可能原因：散热器换热面结垢、滑油流量不足、热负荷异常升高（轴承损伤）。处理：检查散热器压差与温差、校核流量、监测回油温度与金属颗粒含量。某发动机回油 150℃ 报警，检查发现 FCOC 燃油侧阀门故障导致流量偏低、散热不足。"}], "6": [{"t": "燃油作为热沉", "d": "燃油是飞机上最大的热沉之一，用于吸收滑油、IDG（整体驱动发电机）、液压系统等的热量，最终热量随燃油消耗进入燃烧室或被带回油箱。", "a": "燃油热沉能力 = ṁ_fuel × c_p × ΔT_allow。约束是双向的：上限约 150–180℃（超过会热氧化结焦），下限约 −30℃（防止溶解水析出结冰）。因此燃油热沉能力不是无限的，取决于当前燃油温度距上限还有多少余量以及燃油流量。", "e": "巡航时燃油消耗 0.8 kg/s、c_p=2000、允许温升 60 K → 热沉能力 = 0.8×2000×60 = 96 kW。起飞时发动机耗油率虽高但热负荷更大，且若刚加满油（油箱温度低）则热沉充裕；长时间巡航后油箱温度上升，可用余量减少——需要动态管理。"}, {"t": "燃油结焦", "d": "燃油在超过一定温度后发生热氧化反应，生成胶质与固体沉积物（结焦），附着在换热面与喷嘴内壁，堵塞通道、恶化雾化。", "a": "结焦速率随温度呈指数上升，通常在 150–180℃ 以上显著加速，且受换热面壁温影响更大（壁面处温度高于主流，是结焦起始点）。因此设计判据往往是换热面壁温上限而非主流温度上限。此外，燃油中溶解氧在加热时析出会加速氧化——除氧（deoxygenation）可显著抑制结焦。", "e": "某 FCOC 燃油出口主流温度 120℃，但换热面壁温达 190℃（局部热流集中），运行 500 小时后检查发现壁面有 0.1 mm 结焦层，导致换热系数下降 15%、压降上升 20%。改进：增大燃油侧流速（提高 h、降低壁温）、增加除氧装置。"}, {"t": "燃油结冰", "d": "燃油中溶解的水分在低温下析出形成冰晶，可能堵塞油滤、管路与燃油-滑油热交换器。", "a": "燃油能溶解少量水（Jet A-1 约 50–80 ppm），低温下溶解度下降，水析出结成冰。飞行中油箱温度可降至 −30℃ 甚至更低（高空长航时）。防冰手段：① 燃油添加剂（FSII 防冰剂）；② 燃油回流加热（把发动机回来的热燃油引回油箱）；③ 在油滤前设加热器。结冰风险点是节流处（压降导致温度进一步下降）。", "e": "长航时飞行 8 小时后油箱温度 −25℃，溶解水析出，油滤压差从 5 kPa 升至 25 kPa（冰堵）。措施：开启燃油回流加热，把部分 60℃ 回油引回油箱，维持油箱温度在 0℃ 以上；或按规定添加 FSII 防冰剂。"}, {"t": "FCOC 燃-滑油热交换器", "d": "FCOC 是利用燃油冷却滑油的热交换器，是滑油系统主散热手段，也是把热量从滑油转移到燃油的枢纽。", "a": "设计要点：① 按热端温差校核（滑油出口与燃油出口温差不能太小，否则面积需求激增）；② 两侧压降限制（燃油侧压降过大影响供油压力，滑油侧压降过大影响轴承供油）；③ 结焦约束（控制燃油侧壁温）；④ 旁通阀（低燃油流量或燃油温度过高时旁通保护系统）。", "e": "滑油 0.4 kg/s 从 130→90℃（放热 32 kW），燃油 0.5 kg/s 从 40℃ 升温。燃油出口 = 40 + 32000/(0.5×2000) = 72℃。热端温差：滑油入口 130 vs 燃油出口 72 → 58 K；冷端：滑油出口 90 vs 燃油入口 40 → 50 K。LMTD ≈ (58−50)/ln(58/50) = 54 K。若 U=500 W/m²K → A = 32000/(500×54) = 1.19 m²。"}, {"t": "热沉余度与最恶劣工况", "d": "热沉余度是系统在最恶劣工况下仍能满足温度限制的能力；最恶劣工况是热负荷最大而热沉能力最小的工况组合。", "a": "对燃油系统，最恶劣工况通常是起飞/爬升或复飞：发动机热负荷大，但此时若油箱温度已高（长航后）或燃油流量相对不足，热沉余度最小。此外地面慢车（低燃油流量、无冲压空气、高环境温度）也是严苛工况。设计必须校核这些工况，而非仅校核巡航。", "e": "巡航：热负荷 100 kW、燃油热沉能力 96 kW 加空气 20 kW → 余度充足。起飞：热负荷 120 kW，燃油流量虽大但油箱温度高导致允许温升仅 30 K → 燃油热沉 = 0.8×2000×30 = 48 kW，空气冲压不足仅 10 kW → 总 58 kW < 120 kW，缺口 62 kW。解决：提高回油循环量、限制附件载荷、或接受短时超限（瞬态）。"}], "7": [{"t": "整机热平衡矩阵", "d": "把滑油、燃油、空气、液压、电气等各系统的热源与热沉联立，形成系统级热平衡关系的方法。", "a": "核心是识别：① 每个系统的热负荷；② 可用热沉及其温度/量/代价；③ 各系统间的热量传递路径（如滑油→燃油→燃烧）。通过矩阵可快速找出热瓶颈系统（余度最小的那个）与关键工况。这是从部件思维升级到系统思维的关键一步。", "e": "某工况热平衡：热源——轴承/齿轮 8 kW、IDG 15 kW、液压 5 kW；热沉——燃油 96 kW（受温升限制）、外涵空气 20 kW、环境 3 kW。燃油吸收滑油 8 + IDG 15 + 液压 5 = 28 kW < 96 kW，燃油系统余度足够；瓶颈可能在滑油→燃油的 FCOC 面积或燃油出口温度上限。"}, {"t": "热网络建模", "d": "用节点—热阻—热容建立集中参数热网络（思路类似电路），通过求解方程组得到各节点温度与热流的方法。", "a": "每个节点代表一个部件或控制体，有热容 C（决定瞬态响应速度）；节点间用热阻 R 连接（导热/对流/辐射/流量输运）；热源作为注入节点的功率。稳态求解线性方程组，瞬态求解微分方程组。优点是计算极快、便于参数扫掠与优化；缺点是无法给出局部细节（需 CFD 补充）。", "e": "3 节点模型：燃气节点 T_g（已知 1700 K）、叶片金属节点 T_m、冷气节点 T_c（已知 800 K）。热阻 R_gm=8e-4（燃气→金属，含气膜与涂层）、R_mc=1.25e-3（金属→冷气）。稳态：q=(1700−800)/(8e-4+1.25e-3)=900/2.05e-3=439 kW/m²。T_m = 1700 − 439000×8e-4 = 1349 K。"}, {"t": "1D-3D 耦合仿真", "d": "用 1D 系统级模型（如 Flowmaster/AMESim）提供边界条件，3D CFD 与共轭传热（CHT）校核局部温度场，两者迭代耦合的分析方法。", "a": "1D 模型擅长系统级流量分配、压力与热的输运，计算快，可覆盖全工况；3D CHT 擅长局部细节（气膜覆盖、内部通道换热、TBC 效应），计算昂贵。耦合流程：1D 给出 3D 的进出口边界（压力、温度、流量），3D 算出的换热量/压降回代 1D，迭代直到边界一致。这是工业界标准做法。", "e": "涡轮叶片冷却分析：1D 二次空气系统模型算出冷气流量 0.02 kg/s、入口 800 K、出口压力 12 bar → 作为 3D CHT 边界。3D 算得金属最高温 1260 K、气膜效率 0.35、通道压降 0.8 bar → 回代 1D 更新流量与压降。迭代 3–4 轮后收敛，金属温度稳定在 1250±10 K。"}, {"t": "最恶劣工况选取", "d": "从全部飞行任务中识别出对热管理最不利的工况，作为设计校核的基准。", "a": "典型严苛工况：① 起飞/爬升——热负荷大、空速低（冲压空气少）、燃油流量相对热负荷可能不足；② 巡航——持续时间长，稳态温度最高（热惯性充分发展）；③ 复飞/加减速——瞬态热冲击，热应力与低周疲劳；④ 地面慢车/高温天——无冲压空气、环境温度高。不同系统的最恶劣工况可能不同，需分别识别。", "e": "对涡轮叶片：最恶劣是起飞（TIT 最高、持续时间虽短但热流最大）。对滑油系统：最恶劣可能是巡航末端（油温累积最高）或地面慢车（无冷却空气）。对燃油系统：长航后起飞（油箱温度高、热沉余度小）。设计需对每个系统分别确定设计点，不能一刀切。"}, {"t": "优化目标与约束", "d": "热管理优化是在满足温度与寿命约束下，最小化代价（引气量、重量、油耗）的多目标权衡问题。", "a": "目标函数：最小总引气量 / 最小系统重量 / 最低耗油率。约束条件：金属温度上限（决定蠕变寿命）、低周疲劳循环数、燃油结焦温度、滑油闪点与氧化温度、材料许用应力。多目标之间常冲突（如减少引气会升高金属温度、缩短寿命），用 Pareto 前沿展示权衡关系，由设计者按机型定位选点。", "e": "优化示例：目标最小化引气量，约束 T_m ≤ 1250 K、寿命 ≥ 20000 循环。Pareto 前沿：引气 6% → T_m=1245 K、寿命 21000 循环（可行）；引气 5.5% → T_m=1258 K（超限，不可行）。故最优可行解约在引气 6%。若允许改用 CMC 材料（耐温 +200 K），则引气可降至 4.5%，但成本上升——需综合权衡。"}], "8": [{"t": "CMC 陶瓷基复合材料", "d": "CMC（Ceramic Matrix Composite）是以陶瓷为基体、纤维增强的复合材料，典型 SiC/SiC，密度约为高温合金的 1/3，耐温可达 1400–1500℃。", "a": "优势：耐温高（可减少甚至取消冷却气）、密度低（减重、降低离心应力）、热膨胀系数低。挑战：脆性（应变容限小）、氧化与水氧腐蚀（需环境障涂层 EBC）、与金属的连接与装配、成本高。应用趋势：从静子（导向器、燃烧室壁）向转子叶片推进。", "e": "高压涡轮导向器改用 SiC/SiC：耐温从 1250 K 提到 1450 K，冷却气减少约 60%。若原引气 8%，则节省约 2–3%，推力挽回约 1.5–2%，或用于提高 TIT 获得更大性能收益。但需解决 EBC 涂层在 1400℃ 水氧环境下的长期稳定性——目前寿命仍是瓶颈。"}, {"t": "双层壁与增材制造冷却", "d": "双层壁（double-wall）结构：外层带气膜孔或多孔、内层承载并带微通道，中间形成冷气腔。增材制造（3D 打印）使传统无法加工的复杂内冷结构得以实现。", "a": "双层壁优势：外层可用耐温材料（如 CMC）、内层保证强度，冷气在夹层中先冲击内层再经外层气膜孔流出，形成高效复合冷却。增材制造的价值在于点阵结构、随形冷却通道、一体化成形。挑战：表面粗糙度导致流阻增加（需后处理）、工艺一致性、疲劳性能数据积累、认证体系尚在完善。", "e": "3D 打印双层壁导向器：外层 0.8 mm 带扇形气膜孔阵列、内层 1.2 mm 带微通道与冲击孔。试验表明在相同冷气量下金属温度比传统结构低 60–80 K，或在相同金属温度下节省冷气 25–30%。代价：打印件表面 Ra≈8–12 μm，需磨粒流加工降至 3 μm 以下以控制流阻。"}, {"t": "热障涂层 TBC 失效机理", "d": "TBC 系统典型为金属基底 / 粘结层（MCrAlY）/ 热生长氧化物 TGO / 陶瓷面层（7YSZ）。失效主要形式是 TGO 增厚产生应力导致陶瓷层剥落。", "a": "失效机理：高温下氧通过陶瓷层扩散，在粘结层界面生成 TGO（主要是 α-Al₂O₃）。TGO 生长伴随体积膨胀，加上陶瓷层与金属热膨胀系数不匹配，在热循环中产生应力，最终导致裂纹扩展与剥落。TGO 厚度达到约 5–10 μm 常是失效临界。提高寿命的手段：优化粘结层成分（控制 Al 含量）、降低陶瓷层烧结、控制热循环幅度。", "e": "某涡轮叶片 TBC 在运行 8000 循环后剥落。分析：TGO 厚度达 8 μm（临界约 7 μm），且陶瓷层因长期高温已烧结致密（应变容限下降）。改进：将粘结层 Al 含量优化以减缓 TGO 生长速率约 30%，并采用柱状晶结构 EB-PVD 陶瓷层（应变容限优于等离子喷涂 APS），寿命提升至 12000 循环。"}, {"t": "自适应热管理", "d": "根据发动机实时工况动态调节冷却气流量与分配（通过可变几何、主动阀、智能控制律），在非设计点降低引气代价的技术。", "a": "传统冷却系统按最恶劣工况（起飞）设计，在巡航等工况下冷却气过量，造成不必要的性能损失。自适应方案：在起飞全开冷却，巡航时关小阀门减少冷气，把节省的引气还给主流。实现依赖：可靠的执行机构（高温阀）、准确的状态感知（金属温度/热流监测或模型预测）、FADEC 控制律集成。这是全权限数字电子控制的发展方向。", "e": "巡航工况下将高压涡轮冷气从 8% 降至 6.5%：推力挽回约 1%、耗油率下降约 0.7%。但需要实时监测金属温度——若模型预测 T_m 逼近 1250 K 上限则自动回调冷气。关键技术是建立高精度的实时热模型（基于热网络的降阶模型）。"}, {"t": "综合案例分析方法", "d": "面对一个实际热问题时，从问题定义到方案验证的标准工作流程。", "a": "六步法：① 明确热源、热沉、工况与限制条件（画能量流向图）；② 建立热网络模型（节点/热阻/热容）；③ 手算校核量级（确认模型合理性，量级不对说明假设有误）；④ 3D CFD/CHT 精细分析（局部细节、气膜、通道）；⑤ 试验验证（测温、热像、寿命试验）；⑥ 回归设计迭代（用试验数据修正模型，重新优化）。关键是先量级后精细——跳过手算直接做 CFD，容易在错误假设上浪费时间。", "e": "案例：某型发动机高压涡轮叶片出现烧蚀。① 明确：T_g=1750 K、T_c=820 K、前缘烧蚀；② 热网络算得 T_m 应≈1240 K（在允许范围）；③ 手算发现前缘局部热流是平均值的 2.5 倍（驻点效应）；④ CFD 显示前缘气膜覆盖不足（吹风比偏低）；⑤ 试验测温确认前缘 1310 K（超允许 60 K）；⑥ 修正方案：增大前缘气膜孔密度与吹风比，重新分析后前缘降至 1245 K。"}]};

const dateOf = s=> (s||'').slice(0,10);
const todayStr = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

const FORMCLASS = {'视频':'video','书籍':'book','论文':'paper','工具':'tool','标准':'standard','软件':'software','练习':'exercise'};
const FORMLABEL = {'视频':'🎬','书籍':'📕','论文':'📄','工具':'🛠️','标准':'📐','软件':'💻','练习':'✍️'};

/* local check-in overrides (snapshot mode, stored on device only) */
const LS_KEY='aero_checkin_v1';
let overrides={};
try{overrides=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(e){}
function statusOf(t){return overrides[t.id]||t.status||'未开始';}
function setStatus(t,s){
  if(ONLINE){
    fetch(API_BASE+'/api/status',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({record_id:t.id,status:s})})
      .then(r=>r.json()).then(j=>{
        if(j && j.ok){ t.status=s; delete overrides[t.id];
          localStorage.setItem(LS_KEY,JSON.stringify(overrides)); render(); }
        else { alert('写回飞书失败：'+((j&&(j.error||j.detail))||'未知错误')); }
      })
      .catch(()=>{ overrides[t.id]=s; localStorage.setItem(LS_KEY,JSON.stringify(overrides)); render(); });
    return;
  }
  overrides[t.id]=s; localStorage.setItem(LS_KEY,JSON.stringify(overrides)); render();
}

/* ---------- 每日学习记录（本设备保存） ---------- */
const LOG_KEY='aero_dailylog_v1';
let dailyLog={};
try{dailyLog=JSON.parse(localStorage.getItem(LOG_KEY)||'{}');}catch(e){}
function getLog(d){ return dailyLog[d] || {min:0, note:'', done:false}; }
function saveLog(d,obj){
  dailyLog[d]=Object.assign({}, getLog(d), obj);
  localStorage.setItem(LOG_KEY, JSON.stringify(dailyLog));
}
/* 连续打卡天数 */
function streak(){
  let n=0, d=new Date();
  for(let i=0;i<400;i++){
    const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const L=dailyLog[s];
    if(L && (L.min>0 || L.note || L.done)){ n++; }
    else if(i>0){ break; }
    d.setDate(d.getDate()-1);
  }
  return n;
}
function weekMinutes(){
  let tot=0, d=new Date();
  for(let i=0;i<7;i++){
    const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    tot += Number((dailyLog[s]&&dailyLog[s].min)||0);
    d.setDate(d.getDate()-1);
  }
  return tot;
}
function kpForWeek(w){
  const wk=String(w);
  const base=(KNOWLEDGE[wk]||[]).map((p,i)=>Object.assign({_id:'W'+wk+'#'+i},p));
  const auto=AUTOKP.filter(x=>String(x.week)===wk).map(x=>Object.assign({_id:'A#'+x.id,_auto:1},x));
  return base.concat(auto);
}

/* ---------- 间隔复习（艾宾浩斯曲线 1/2/4/7/15/30 天） ---------- */
const RV_KEY='aero_review_v1';
const RV_STEPS=[1,2,4,7,15,30];
let review={};
try{review=JSON.parse(localStorage.getItem(RV_KEY)||'{}');}catch(e){}
function rvOf(id){ return review[id]||{stage:0,next:''}; }
function rvMark(id){
  if(!id) return;
  const r=rvOf(id);
  const step=RV_STEPS[Math.min(r.stage,RV_STEPS.length-1)];
  const d=new Date(); d.setDate(d.getDate()+step);
  review[id]={stage:Math.min(r.stage+1,RV_STEPS.length),next:d.toISOString().slice(0,10),last:todayStr()};
  localStorage.setItem(RV_KEY,JSON.stringify(review));
  render();
}
function rvReset(id){ if(id){delete review[id]; localStorage.setItem(RV_KEY,JSON.stringify(review)); render();} }
function rvDueIds(){ const t=todayStr(); return Object.keys(review).filter(k=>review[k].next && review[k].next<=t); }
function allKp(){
  const out=[];
  Object.keys(KNOWLEDGE).forEach(w=>{(KNOWLEDGE[w]||[]).forEach((p,i)=>out.push(Object.assign({_id:'W'+w+'#'+i,_week:w},p)));});
  AUTOKP.forEach(x=>out.push(Object.assign({_id:'A#'+x.id,_auto:1,_week:String(x.week||'')},x)));
  return out;
}
function kpById(id){ return allKp().filter(p=>p._id===id)[0]; }
/* 知识点渲染：可折叠 */
function kpBlock(w, openIdx){
  const list=kpForWeek(w);
  if(!list.length) return '';
  let h='<div class="detail"><div class="k">📘 本周知识点（'+list.length+'）</div>';
  list.forEach((p,i)=>{
    const open = openIdx===i;
    let body='';
    if(p.d) body+='<div class="kpsec"><b>定义</b>'+esc(p.d)+'</div>';
    if(p.a) body+='<div class="kpsec"><b>解析</b>'+esc(p.a)+'</div>';
    if(p.e) body+='<div class="kpsec"><b>示例</b>'+esc(p.e)+'</div>';
    if(p.src) body+='<div class="kpsec"><b>来源</b>'+esc(p.src)+'</div>';
    if(p.link) body+='<div class="kpsec"><a class="btn" href="'+esc(p.link)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">📎 打开资料</a></div>';
    const rv=rvOf(p._id||'');
    body+='<div class="kprv" onclick="event.stopPropagation();rvMark(\''+(p._id||'')+'\')">'
      + (rv.next ? ('🔁 已学 '+rv.stage+' 轮 · 下次复习 '+rv.next+'（点击再学一轮）')
                 : '➕ 标记已学，加入复习计划')
      + '</div>';
    h+='<div class="kp'+(open?' open':'')+'" onclick="this.classList.toggle(\'open\')">'
      + '<div class="kpt">'+esc(p.t)+(open?' ▾':' ▸')+'</div>'
      + '<div class="kpb">'+body+'</div></div>';
  });
  h+='<div class="tiny muted" style="margin-top:6px">点击标题展开定义 / 解析 / 示例</div></div>';
  return h;
}
/* 保存当日学习记录 */
function doSaveLog(d){
  const m=document.getElementById('logmin'), n=document.getElementById('lognote');
  saveLog(d,{min:Number((m&&m.value)||0)||0, note:(n&&n.value)||''});
  const s=document.getElementById('logsaved');
  if(s){ s.textContent='已保存 ✓'; setTimeout(()=>{s.textContent='';},2000); }
  render();
}
/* 今日完成打卡：记录时长并把当日任务标记完成 */
function doFinishDay(d){
  const m=document.getElementById('logmin'), n=document.getElementById('lognote');
  saveLog(d,{min:Number((m&&m.value)||0)||0, note:(n&&n.value)||'', done:true});
  TASKS.filter(t=>dateOf(t.date)===d).forEach(t=>setStatus(t,'已完成'));
  render();
}

let SNAPSHOT = DATA;
let ONLINE = false;
let TASKS=[], WEEKS=[], MATS=[], AUTOKP=[], weekByNo={};

function applyData(d){
  TASKS = d.tasks||[]; WEEKS = d.weeks||[]; MATS = d.materials||[];
  AUTOKP = d.autoKnowledge||[];
  weekByNo={}; WEEKS.forEach(w=>weekByNo[w.week]=w);
  const b=document.getElementById('syncbadge');
  if(b){ b.textContent = ONLINE? '● 已连接飞书（改动实时同步）' : '○ 离线快照（只读）';
         b.style.color = ONLINE? 'var(--green)' : 'var(--mut)'; }
}

async function loadFromBackend(){
  try{
    const r = await fetch(API_BASE+'/api/data', {cache:'no-store'});
    if(!r.ok) throw new Error('http '+r.status);
    const d = await r.json();
    if(!d.tasks) throw new Error('bad payload');
    ONLINE=true; applyData(d);
  }catch(e){
    ONLINE=false; applyData(SNAPSHOT);
  }
  render();
}

    <div class="stat"><div class="n" style="color:var(--orange)">${MATS.length}</div><div class="l">资料总数</div></div>

      <div style="text-align:right">
        <div class="lg" style="color:var(--green)">${tdLog.min||0}<span class="sm"> 分</span></div>
        <div class="tiny muted">🔥 连续 ${streak()} 天</div>
      </div>
    </div>

function taskCard(t,showWeek){
  const st=statusOf(t);
  const dotColor = st==='已完成'?'var(--green)':st==='进行中'?'var(--amber)':'var(--mut)';
  const mats = t.materials||[];
  let mt='';
  if(showWeek && t.theme) mt+=`<span class="tag" style="margin-right:6px">${esc(t.week)} ${esc(t.theme)}</span>`;
  mt+=`<span class="tag">${esc(t.type||'学习')}</span>`;
  if(mats.length) mt+=`<span class="tag">📎 ${mats.length} 资料</span>`;
  let h=`<div class="card tap" onclick="openTask('${t.id}')">
    <div class="row between">
      <div class="md" style="flex:1;margin-right:8px">${esc(t.desc||'未命名任务')}</div>
      <span class="dot" style="background:${dotColor}"></span>
    </div>
    <div style="margin-top:8px">${mt}</div>
    ${t.estMin?`<div class="tiny muted" style="margin-top:6px">⏱ 预计 ${t.estMin} 分钟 · ${esc(dateOf(t.date))}</div>`:`<div class="tiny muted" style="margin-top:6px">${esc(dateOf(t.date))}</div>`}
  </div>`;
  return h;
}

function openTask(id){
  const t=TASKS.find(x=>x.id===id); if(!t)return;
  const st=statusOf(t);
  let mats='';
  (t.materials||[]).forEach(m=>{
    const ic=FORMLABEL[m.form]||'📎';
    const link = m.video? m.video : (m.link||'');
    let btn = link? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">打开</a>`:'';
    mats+=`<div class="material"><div class="ic">${ic}</div><div style="flex:1;min-width:0">
      <div class="sm">${esc(m.title||m.fingerprint||'资料')}</div>
      <div class="tiny muted">${esc(m.form||'')} ${m.duration?('· '+m.duration+'分钟'):''} ${m.subject?('· '+m.subject):''}</div>
      ${m.note?`<div class="tiny sub2" style="margin-top:3px">${esc(m.note)}</div>`:''}
      <div class="links">${btn}</div>
    </div></div>`;
  });
  const statusBtns = STATUS.map(s=>`<button class="btn ${s===st?'':''}" onclick="setStatusById('${t.id}','${s}')" style="${s===st?'background:var(--green)':''}">${s}</button>`).join(' ');
  const h=`<div class="card">
    <div class="row between"><div class="md">${esc(t.desc||'任务')}</div><button class="btn out" onclick="goTab('tasks')">← 返回</button></div>
    <div style="margin:8px 0">${t.week?`<span class="tag">${esc(t.week)} ${esc(t.theme)}</span> `:''}<span class="tag">${esc(t.type||'学习')}</span> ${t.estMin?`<span class="tag">⏱ ${t.estMin}分</span>`:''}</div>
    ${t.output?`<div class="detail"><div class="k">输出物</div>${esc(t.output)}</div>`:''}
    ${t.note?`<div class="detail"><div class="k">备注</div>${esc(t.note)}</div>`:''}
    <div class="detail"><div class="k">当前状态：${esc(st)}</div><div style="display:flex;gap:8px;margin-top:4px">${statusBtns}</div>
      <div class="tiny muted" style="margin-top:6px">打卡仅保存在本设备（快照版）；接入飞书后自动同步。</div></div>
    ${kpBlock(t.week)}
    <div class="detail"><div class="k">📝 本任务学习记录</div>
      <div class="logbox">
        <textarea id="tasknote" placeholder="记录这个任务的推导过程、卡点、结论…">${esc(getLog(dateOf(t.date)).note||'')}</textarea>
        <div class="logrow">
          <button class="btn" onclick="doSaveTaskNote('${t.id}','${dateOf(t.date)}')">💾 保存笔记</button>
          <span id="tnotesaved" class="saved"></span>
        </div>
      </div>
    </div>
    <div class="detail"><div class="k">关联资料（${t.materials?t.materials.length:0}）</div>${mats||'<div class="tiny muted">无</div>'}</div>
  </div>`;
  $('#view').innerHTML=h;
}

    <div class="row between"><div class="md">📝 ${d} 学习记录</div>

  /* --- 今日待复习（间隔重复） --- */

    due.slice(0,15).forEach(id=>{

      h+='<div class="kp" onclick="this.classList.toggle(\'open\')"><div class="kpt">'+esc(p.t||'知识点')+' ▸</div><div class="kpb">'+body+'</div></div>';
    });

    const nx=TASKS.map(t=>({t,dd:dateOf(t.date)})).filter(x=>x.dd>=d).sort((a,b)=>a.dd<b.dd?-1:1)[0];
    h+=`<div class="card"><div class="tiny muted">${d} 没有安排任务。</div></div>`;
    if(nx){h+=`<div class="tiny sub2" style="margin:0 2px 6px">最近任务（${nx.dd}）</div>`;h+=taskCard(nx.t,true);}

    list.forEach(t=>h+=taskCard(t,true));

function viewTasks(){
  let h=`<div class="seg" id="seg">
    <button class="on" onclick="renderKanban('all',this)">全部</button>
    <button onclick="renderKanban('未开始',this)">未开始</button>
    <button onclick="renderKanban('进行中',this)">进行中</button>
    <button onclick="renderKanban('已完成',this)">已完成</button>
  </div><div id="kanban"></div>`;
  $('#view').innerHTML=h;
  renderKanban('all',$('#seg').firstChild);
}
function renderKanban(filter,btn){
  if(btn){[...btn.parentNode.children].forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
  const cols=[['未开始','var(--mut)'],['进行中','var(--amber)'],['已完成','var(--green)']];
  let h='<div class="kanban">';
  cols.forEach(([s,c])=>{
    const items=TASKS.filter(t=>statusOf(t)===s && (filter==='all'||statusOf(t)===filter));
    h+=`<div class="kcol"><h4><span class="dot" style="background:${c};margin-right:5px"></span>${s} (${items.length})</h4>`;
    items.forEach(t=>{
      h+=`<div class="kitem" onclick="openTask('${t.id}')">${esc(t.desc||'任务')}<div class="d">${esc(dateOf(t.date))} · ${esc(t.week)}</div></div>`;
    });
    h+=`</div>`;
  });
  h+='</div>';
  $('#kanban').innerHTML=h;
}

let libFilter='全部';
function viewLibrary(){
  const forms=['全部',...Array.from(new Set(MATS.map(m=>m.form).filter(Boolean)))];
  let h=`<div class="chips" id="libchips">`+forms.map(f=>`<div class="chip ${f===libFilter?'on':''}" onclick="libFilter='${f}';viewLibrary()">${f}</div>`).join('')+`</div><div id="liblist"></div>`;
  $('#view').innerHTML=h;
  renderLib();
}
function renderLib(){
  [...$('#libchips').children].forEach(c=>c.classList.toggle('on',c.textContent===libFilter));
  let list=MATS.slice();
  if(libFilter!=='全部') list=list.filter(m=>m.form===libFilter);
  list.sort((a,b)=>(a.week||'').localeCompare(b.week||'')|| (a.fingerprint||'').localeCompare(b.fingerprint||''));
  if(!list.length){$('#liblist').innerHTML='<div class="empty">该分类暂无资料</div>';return;}
  let h='';
  list.forEach(m=>{
    const ic=FORMLABEL[m.form]||'📎';
    const cls=FORMCLASS[m.form]||'';
    const link=m.video||m.link||'';
    const btn=link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">打开</a>`:'';
    h+=`<div class="card">
      <div class="row between"><div class="md" style="flex:1;margin-right:8px">${esc(m.title||m.fingerprint||'资料')}</div>
        <span class="tag ${cls}">${ic} ${esc(m.form||'')}</span></div>
      <div class="tiny muted" style="margin:6px 0">${m.week?('📅 '+esc(m.week)+' '):''}${m.subject?('· '+esc(m.subject)):''}${m.duration?(' · ⏱'+m.duration+'分'):''}</div>
      ${m.note?`<div class="tiny sub2">${esc(m.note)}</div>`:''}
      <div class="links" style="margin-top:8px">${btn}</div>
    </div>`;
  });
  $('#liblist').innerHTML=h;
}

function viewWeeks(){
  let h='';
  WEEKS.forEach(w=>{
    const wkTasks=TASKS.filter(t=>t.week===w.week);
    const done=wkTasks.filter(t=>statusOf(t)==='已完成').length;
    const wp=wkTasks.length?Math.round(done/wkTasks.length*100):0;
    h+=`<div class="card tap" onclick="openWeek('${w.id}')">
      <div class="row between"><div class="md">${esc(w.week)} · ${esc(w.theme)}</div><span class="tag">${done}/${wkTasks.length}</span></div>
      <div class="barmini"><i style="width:${wp}%"></i></div>
      <div class="tiny muted" style="margin-top:7px">${esc(w.period||'')}</div>
    </div>`;
  });
  $('#view').innerHTML=h;
}
function openWeek(id){
  const w=WEEKS.find(x=>x.id===id); if(!w)return;
  const f=(k)=> (w[k]?`<div class="detail"><div class="k">${k}</div>${esc(w[k])}</div>`:'');
  const h=`<div class="card">
    <div class="row between"><div class="md">${esc(w.week)} · ${esc(w.theme)}</div><button class="btn out" onclick="goTab('weeks')">← 返回</button></div>
    <div class="tiny muted" style="margin-top:6px">${esc(w.period||'')}</div>
    ${f('目标')}${f('前置知识')}${f('完成标准')}${f('自测题')}${f('精选资料')}${f('工作练习')}${f('备注')}
    ${kpBlock(w.week, 0)}
  </div>`;
  $('#view').innerHTML=h;
}

/* ---------- router ---------- */
const TITLES={home:'学习驾驶舱',today:'今日任务',tasks:'任务看板',library:'资料库',weeks:'周计划'};
let curTab='home';
function goTab(t){
  curTab=t;
  [...$('#tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#subline').textContent=TITLES[t]||'';
  if(t==='home')viewHome();
  else if(t==='today')viewToday();
  else if(t==='tasks')viewTasks();
  else if(t==='library')viewLibrary();
  else if(t==='weeks')viewWeeks();
  window.scrollTo(0,0);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)goTab(b.dataset.tab);});
applyData(SNAPSHOT);
goTab('home');
loadFromBackend();

/* 原生 App：把 target=_blank 的外部链接（B站/YouTube 等）转用系统浏览器打开 */
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[target="_blank"]');
  if(a && a.href){
    e.preventDefault();
    if(window.AndroidBridge){ AndroidBridge.openExternal(a.href); }
    else { window.open(a.href,'_blank'); }
  }
});
</script>
